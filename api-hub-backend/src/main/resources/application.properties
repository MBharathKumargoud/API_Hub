# ---------- Optional .env file ----------
spring.config.import=optional:file:.env[.properties]

# ---------- Server ----------
spring.application.name=api-hub-backend
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# update creates/updates tables automatically; use cautiously in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Password reset (OTP by email) ----------
app.password-reset.expiry-minutes=${RESET_OTP_EXPIRY_MINUTES:10}

# ---------- Email using Resend API ----------
# MAIL_ENABLED=false: email sending is disabled.
# MAIL_ENABLED=true: OTP emails are sent through Resend.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
app.mail.resend-api-key=${RESEND_API_KEY:}

# ---------- Seeding the 50 APIs ----------
app.seed.enabled=true

# ---------- API tester limits ----------
app.tester.connect-timeout-seconds=5
app.tester.request-timeout-seconds=15
app.tester.max-response-bytes=1048576

# ---------- Third-party API keys ----------
# Provider API keys are supplied by users through the frontend.
# Do not store user-provided API keys on the server.
# Example for a future server-side key:
# app.keys.openweather=${OPENWEATHER_API_KEY:}