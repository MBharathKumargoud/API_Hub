# ---------- Optional .env file (KEY=VALUE lines, see .env.example) ----------
spring.config.import=optional:file:.env[.properties]

# ---------- Server ----------
spring.application.name=api-hub-backend
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" creates/updates tables automatically (development only).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Password reset (OTP by email) ----------
app.password-reset.expiry-minutes=${RESET_OTP_EXPIRY_MINUTES:10}
# MAIL_ENABLED=false (default): no email is sent; the OTP is printed in the backend console (dev).
# MAIL_ENABLED=true: real emails are sent through the SMTP server below.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@apihub.local}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Seeding the 50 APIs (reads classpath:seed/apis.json) ----------
app.seed.enabled=true

# ---------- API tester limits ----------
app.tester.connect-timeout-seconds=5
app.tester.request-timeout-seconds=15
app.tester.max-response-bytes=1048576

# ---------- Third-party API keys ----------
# The tester forwards the headers the user types in the UI to the provider.
# No provider keys are stored on the server. If you later add server-side keys,
# read them from environment variables here, e.g. app.keys.openweather=${OPENWEATHER_API_KEY:}
